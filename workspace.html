<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OSA Call Center - Workspace</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="icon" href="data:,">
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'] },
          colors: { brandDark: '#0f172a', brandAmber: '#f59e0b' }
        }
      }
    }
  </script>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/callcenter.css">
</head>

<!-- FIX: Changed to flex-col for full-width header -->
<body data-page="workspace" class="text-brandDark font-sans font-normal text-sm h-screen overflow-hidden flex flex-col relative bg-white">
  
  <!-- BACKGROUND BLOBS (Optional, kept for glassmorphism effect) -->
  <div class="absolute inset-0 z-0 overflow-hidden pointer-events-none opacity-40">
    <div class="absolute top-[-10%] left-[-10%] w-[40rem] h-[40rem] bg-amber-100 rounded-full mix-blend-multiply filter blur-3xl"></div>
    <div class="absolute bottom-[-20%] right-[-10%] w-[45rem] h-[45rem] bg-slate-100 rounded-full mix-blend-multiply filter blur-3xl"></div>
  </div>

  <!-- 1. FULL WIDTH HEADER -->
  <header class="w-full glass-panel border-b border-brandDark/5 px-6 py-3 flex justify-between items-center relative z-50 shrink-0">
    <h1 class="text-xl font-medium tracking-tight flex items-center gap-3 text-brandDark">
      <i class="fa-solid fa-phone-volume text-brandAmber"></i> OSA Call Center
    </h1>
    
    <div class="flex items-center gap-5 text-sm">
      <button class="text-brandDark/60 hover:text-brandAmber transition"><i class="fa-regular fa-bell text-lg"></i></button>
      
      <div class="flex items-center gap-3 pl-4 border-l border-brandDark/10">
        <!-- Profile & Logout Dropdown -->
        <div class="relative">
          <button onclick="toggleLogoutModal()" class="flex items-center gap-3 hover:bg-slate-50 p-1.5 rounded-lg transition text-left outline-none">
            <div class="w-8 h-8 bg-brandDark text-white rounded-full flex items-center justify-center">
              <i class="fa-solid fa-user text-xs"></i>
            </div>
            <div class="hidden sm:block">
              <div id="header-user-name" class="text-sm font-medium text-brandDark">Loading...</div>
              <div id="header-user-role" class="text-xs font-normal text-brandDark/60">Role</div>
            </div>
            <i class="fa-solid fa-chevron-down text-xs text-brandDark/40 ml-1"></i>
          </button>

          <div id="logout-modal" class="hidden absolute right-0 mt-2 w-56 bg-white rounded-xl shadow-lg border border-brandDark/5 z-50 overflow-hidden">
            <div class="p-4 border-b border-brandDark/5 bg-slate-50/50">
              <p class="text-xs font-normal text-brandDark/50 mb-1">Signed in as</p>
              <p id="modal-user-email" class="text-sm font-medium text-brandDark truncate">email@loading.com</p>
            </div>
            <button onclick="logout()" class="w-full text-left px-4 py-3 text-sm font-medium text-red-600 hover:bg-red-50 transition flex items-center gap-2">
              <i class="fa-solid fa-arrow-right-from-bracket"></i> Sign out
            </button>
          </div>
        </div>
        
        <div id="global-status-text" class="text-[11px] text-brandDark/50 font-medium flex items-center gap-1 uppercase mt-1 pl-2 border-l border-brandDark/10">
          <span id="global-status-dot" class="w-2 h-2 rounded-full bg-gray-300"></span> OFFLINE
        </div>
      </div>
    </div>
  </header>

  <!-- BOTTOM SECTION (Sidebar + Main Content) -->
  <div class="flex flex-1 overflow-hidden w-full relative z-10">
    
    <!-- 2. SIDEBAR (Below Header, Text on right of minimized icons) -->
    <aside class="w-60 glass-panel border-r border-brandDark/5 flex flex-col py-4 shrink-0 bg-white/60">
      <a href="/workspace" class="flex items-center gap-4 px-6 py-3 text-sm font-medium text-brandAmber bg-brandAmber/10 border-r-2 border-brandAmber transition-colors">
        <i class="fa-solid fa-headset w-5 text-center text-base"></i> Workspace
      </a>
      <a href="/campaigns" class="flex items-center gap-4 px-6 py-3 text-sm font-normal text-brandDark/70 hover:bg-slate-50 hover:text-brandDark transition-colors">
        <i class="fa-solid fa-bullhorn w-5 text-center text-base"></i> Campaigns
      </a>
      <a href="/teamleader" class="flex items-center gap-4 px-6 py-3 text-sm font-normal text-brandDark/70 hover:bg-slate-50 hover:text-brandDark transition-colors">
        <i class="fa-solid fa-user-tie w-5 text-center text-base"></i> Team Lead
      </a>
      <a href="/analytics" class="flex items-center gap-4 px-6 py-3 text-sm font-normal text-brandDark/70 hover:bg-slate-50 hover:text-brandDark transition-colors">
        <i class="fa-solid fa-chart-pie w-5 text-center text-base"></i> Analytics
      </a>
      <a href="/admin" class="flex items-center gap-4 px-6 py-3 text-sm font-normal text-brandDark/70 hover:bg-slate-50 hover:text-brandDark transition-colors mt-auto border-t border-brandDark/5">
        <i class="fa-solid fa-shield-halved w-5 text-center text-base"></i> Admin
      </a>
    </aside>

    <!-- 3. MAIN CONTENT (Page Transition applied) -->
    <main class="flex-1 p-8 overflow-y-auto page-enter bg-slate-50/30">
      
      <!-- Workspace Example Content -->
      <div class="flex justify-between items-center mb-6">
        <div>
          <h2 class="text-2xl font-medium text-brandDark">Agent Workspace</h2>
          <p class="text-sm font-normal text-brandDark/60 mt-1">Manage your assigned queue and log dispositions.</p>
        </div>
        
        <div class="flex items-center gap-6">
          <div class="flex items-center gap-3 bg-white px-4 py-2 rounded-lg border border-brandDark/5 shadow-sm">
            <span class="font-normal text-sm text-brandDark/70" id="clock-status-label">Clocked Out</span>
            <div class="relative inline-block w-10 mr-2 align-middle select-none transition duration-200 ease-in">
              <input type="checkbox" name="toggle" id="clock-in-toggle" onchange="toggleAgentStatus(this)" class="toggle-checkbox absolute block w-5 h-5 rounded-full bg-white border-4 border-gray-300 appearance-none cursor-pointer transition-all duration-300 z-10"/>
              <label for="clock-in-toggle" class="toggle-label block overflow-hidden h-5 rounded-full bg-gray-300 cursor-pointer transition-colors duration-300"></label>
            </div>
          </div>
        </div>
      </div>

      <!-- Main Workspace Panels -->
      <div class="flex gap-6 h-[75vh]">
        <!-- Queue Panel -->
        <div class="w-1/3 glass-card rounded-2xl p-5 flex flex-col">
          <h3 class="font-medium text-brandDark mb-4 border-b border-brandDark/5 pb-3">Your Queue</h3>
          <!-- Content goes here -->
          <div class="flex-1 flex items-center justify-center text-brandDark/40 font-normal">
            No customers assigned
          </div>
        </div>

        <!-- Details Panel -->
        <div class="flex-1 glass-card rounded-2xl p-6 flex flex-col items-center justify-center text-center">
          <i class="fa-solid fa-mug-hot text-5xl text-brandDark/10 mb-4"></i>
          <h3 class="text-lg font-medium text-brandDark mb-2">You are currently offline</h3>
          <p class="text-brandDark/50 font-normal mb-6">Clock in to access your customer queue.</p>
          
          <!-- FIX: Button updated to Amber styling -->
          <button class="bg-brandAmber hover:bg-amber-600 text-white font-medium px-6 py-2.5 rounded-lg shadow-sm transition ease-in">
            Request Shift
          </button>
        </div>
      </div>

    </main>
  </div>
  
  <script src="/callcenter.js"></script>
</body>
</html>
