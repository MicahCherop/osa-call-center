<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - OSA Call Center</title>
  <!-- Cleaned up Tailwind Config -->
    <script src="https://cdn.tailwindcss.com"></script>
 
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { brandDark: '#0f172a', brandAmber: '#f59e0b' }
        }
      }
    }
  </script>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/callcenter.css">
</head>
<body data-page="login" class="h-screen bg-slate-50 flex items-center justify-center relative overflow-hidden">
  
  <div class="absolute inset-0 z-0 overflow-hidden pointer-events-none">
    <div class="absolute top-[-10%] left-[-10%] w-[40rem] h-[40rem] bg-amber-200 rounded-full mix-blend-multiply filter blur-3xl opacity-60"></div>
  </div>
  
  <div class="glass-panel p-8 rounded-2xl w-full max-w-md relative z-10 shadow-2xl bg-white/90 backdrop-blur-md border border-brandDark/10 text-center">
    
    <!-- Changed from font-bold to font-semibold for a cleaner look -->
    <h1 class="text-3xl font-semibold text-brandDark mb-2">OSA Call Center</h1>
    <p class="text-brandDark/60 text-sm mb-8">Sign in securely with your company account</p>
    
    <div id="google-btn-container" class="flex justify-center mb-4">
      <!-- Added font-medium to make the button text crisp but not heavy -->
      <button onclick="redirectToGoogle()" class="w-full bg-brandDark hover:bg-slate-800 text-white py-3 rounded-lg shadow-md transition flex items-center justify-center gap-3 font-medium">
        <i class="fa-brands fa-google text-brandAmber text-lg"></i> Continue with Google
      </button>
    </div>
    
    <!-- Changed font-bold to font-medium for the status text -->
    <div id="login-status" class="text-brandAmber text-sm mt-3 font-medium hidden flex items-center justify-center gap-2">
      <i class="fa-solid fa-circle-notch fa-spin"></i> Verifying authorization...
    </div>
    <div id="login-error" class="text-red-500 text-sm mt-3 hidden font-medium"></div>
  </div>

  <script src="/callcenter.js"></script>
  
  <script>
    const CLIENT_ID = "106325673835-4moq7op50u80oet78ln84t241a88a200.apps.googleusercontent.com";
    
    function redirectToGoogle() {
    // Smart Redirect: Detects if you are testing locally or on the live site
    const isLocalhost = window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1";
    const redirectUri = isLocalhost 
        ? window.location.origin + "/login" 
        : "https://osa-call-center.vercel.app/login";
      
  const oauth2Endpoint = "https://accounts.google.com/o/oauth2/v2/auth";
  // ...
      
      const form = document.createElement("form");
      form.setAttribute("method", "GET");
      form.setAttribute("action", oauth2Endpoint);

      const params = {
        client_id: CLIENT_ID,
        redirect_uri: redirectUri,
        response_type: "token",
        scope: "email profile",
        include_granted_scopes: "true",
        state: "pass-through value",
        prompt: "select_account" // This forces the account chooser screen!
      };

      for (let p in params) {
        let input = document.createElement("input");
        input.setAttribute("type", "hidden");
        input.setAttribute("name", p);
        input.setAttribute("value", params[p]);
        form.appendChild(input);
      }

      document.body.appendChild(form);
      form.submit();
    }

    // 2. Intercept the URL when Google sends them back
    window.onload = async function() {
      const hash = window.location.hash;
      
      if (hash && hash.includes("access_token")) {
        // We have returned from Google!
        document.getElementById('login-status').classList.remove('hidden');
        document.getElementById('google-btn-container').classList.add('hidden');
        
        // Parse the token from the URL
        const params = new URLSearchParams(hash.substring(1));
        const accessToken = params.get("access_token");

        // Clean up the URL so it looks nice
        window.history.replaceState(null, null, window.location.pathname);

        try {
          // Exchange the token for the user's email
          const res = await fetch("https://www.googleapis.com/oauth2/v3/userinfo", {
            headers: { Authorization: `Bearer ${accessToken}` }
          });
          const userInfo = await res.json();
          
          if (!userInfo.email) throw new Error("Could not retrieve email from Google.");

          // Send the email to our FastAPI backend
          const backendRes = await fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: userInfo.email })
          });
          
          const data = await backendRes.json();
          if (!backendRes.ok) throw new Error(data.detail || "Database verification failed.");

          // Fix: Mapped directly to data instead of data.user
          localStorage.setItem('USER_EMAIL', data.email);
          localStorage.setItem('USER_ROLE', data.role);
          localStorage.setItem('LOGGED_IN_AGENT', data.name);
          
          // Fix: Removed .html extension 
          window.location.replace('/workspace');

        } catch (err) {
          document.getElementById('login-status').classList.add('hidden');
          document.getElementById('login-error').innerText = err.message;
          document.getElementById('login-error').classList.remove('hidden');
          document.getElementById('google-btn-container').classList.remove('hidden');
        }
      } else {
        // Normal page load, check standard RBAC
        if (typeof enforceSecurity === 'function') enforceSecurity();
      }
    };
  </script>
</body>
</html>
