<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>4G UPIA Campaigns</title>
  <link rel="stylesheet" href="/callcenter-tailwind.css">
  <link rel="icon" type="image/png" href="https://cdn.brandfetch.io/idkNTof4f-/w/400/h/400/theme/dark/icon.jpeg?c=1dxbfHSJFAPEGdCLU4o5B">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body data-page="login" class="text-brandDark font-sans font-normal text-sm h-screen overflow-hidden flex items-center justify-center relative bg-white">
  
  <!-- BACKGROUND BLOBS -->
  <div class="absolute inset-0 z-0 overflow-hidden pointer-events-none opacity-40">
    <div class="absolute top-[-10%] left-[-10%] w-[40rem] h-[40rem] bg-amber-100 rounded-full mix-blend-multiply filter blur-3xl animate-blob"></div>
    <div class="absolute bottom-[-20%] right-[-10%] w-[45rem] h-[45rem] bg-slate-100 rounded-full mix-blend-multiply filter blur-3xl animate-blob"></div>
  </div>
  
  <!-- LOGIN CARD -->
  <div class="glass-panel p-10 rounded-2xl w-full max-w-md relative z-10 shadow-2xl text-center page-enter border border-brandDark/5">
    
    <!-- INCREASED LOGO SIZE (h-20) and added a bit more bottom margin (mb-8) -->
    <img src="https://images.squarespace-cdn.com/content/v1/55ed8436e4b038f693789ca0/1599234024445-FSJEOUYNYWV4X6HDN50R/4G+CAPITAL+LOGO+FA-01.png?format=750w" 
         alt="4G Capital Logo" 
         class="h-20 mx-auto mb-8 object-contain">
    
    <h1 class="text-3xl font-medium text-brandDark mb-2"> Campaigns</h1>
    <p class="text-brandDark/60 text-sm font-normal mb-8">Welcome to Call Center Campaigns<br>Sign in securely to access your workspace</p>
    
    <div id="google-btn-container" class="flex justify-center mb-2">
      <!-- REDUCED BUTTON SIZE (w-2/3 max-w-[260px]) and centered it -->
      <button onclick="handleLoginClick()" class="w-2/3 max-w-[260px] mx-auto bg-white hover:bg-slate-50 text-slate-700 border border-slate-200 py-2.5 rounded-lg shadow-sm transition ease-in flex items-center justify-center gap-3 font-medium">
        <svg class="w-5 h-5 shrink-0" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
        Sign in with Google
      </button>
    </div>
    
    <!-- THE SERIOUS SECURITY BLOCKER -->
    <div id="login-error" class="bg-red-50 border-2 border-red-500 text-red-700 p-5 rounded-xl mt-5 hidden flex-col items-center gap-2 shadow-sm">
      <i class="fa-solid fa-shield-virus text-4xl mb-1 text-red-600"></i>
      <h3 class="font-bold text-lg uppercase tracking-wider text-red-800">Restricted Access</h3>
      <span id="login-error-text" class="font-medium text-sm text-center"></span>
    </div>
  </div>

  <!-- REDIRECTING / LOADING MODAL -->
  <div id="loading-overlay" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 hidden opacity-0 transition-opacity duration-300 items-center justify-center">
    <div class="bg-white p-8 rounded-2xl shadow-2xl flex flex-col items-center max-w-sm w-full mx-4 transform scale-95 transition-transform duration-300" id="loading-modal-card">
      <div class="w-12 h-12 border-4 border-brandAmber border-t-transparent rounded-full animate-spin mb-4"></div>
      <h3 class="text-lg font-medium text-brandDark" id="loading-title">Redirecting...</h3>
      <p class="text-sm text-brandDark/50 mt-1 text-center" id="loading-text">Connecting securely to Google.</p>
    </div>
  </div>
  <script src="/callcenter.js"></script>
  
  <script>
    const CLIENT_ID = "106325673835-4moq7op50u80oet78ln84t241a88a200.apps.googleusercontent.com";
    const LOCAL_REDIRECT_URI = "http://localhost:3000/login.html";
    const LOGIN_API_BASE = `${window.location.origin}/api`;
    
    function handleLoginClick() {
      const overlay = document.getElementById('loading-overlay');
      const card = document.getElementById('loading-modal-card');
      
      document.getElementById('loading-title').innerText = "Redirecting...";
      document.getElementById('loading-text').innerText = "Connecting securely to Google.";
      
      // Hide any previous errors
      document.getElementById('login-error').classList.add('hidden');
      document.getElementById('login-error').classList.remove('flex');
      
      overlay.classList.remove('hidden');
      overlay.classList.add('flex');
      setTimeout(() => {
          overlay.classList.remove('opacity-0');
          card.classList.remove('scale-95');
      }, 10);
      
      setTimeout(() => {
          redirectToGoogle();
      }, 800);
    }

    function redirectToGoogle() {
      const isLocalhost = window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1";
        const redirectUri = isLocalhost
          ? LOCAL_REDIRECT_URI
          : "https://osa-call-center.vercel.app/login";
        
      const oauth2Endpoint = "https://accounts.google.com/o/oauth2/v2/auth";
      
      const form = document.createElement("form");
      form.setAttribute("method", "GET");
      form.setAttribute("action", oauth2Endpoint);

      const params = {
        client_id: CLIENT_ID,
        redirect_uri: redirectUri,
        response_type: "token",
        scope: "email profile",
        include_granted_scopes: "true",
        state: "pass-through value",
        prompt: "select_account"
      };

      for (let p in params) {
        let input = document.createElement("input");
        input.setAttribute("type", "hidden");
        input.setAttribute("name", p);
        input.setAttribute("value", params[p]);
        form.appendChild(input);
      }

      document.body.appendChild(form);
      form.submit();
    }

    window.onload = async function() {
      const hash = window.location.hash;
      
      if (hash && hash.includes("access_token")) {
        const overlay = document.getElementById('loading-overlay');
        const card = document.getElementById('loading-modal-card');
        
        document.getElementById('loading-title').innerText = "Verifying Identity...";
        document.getElementById('loading-text').innerText = "Checking authorization protocols.";
        document.getElementById('google-btn-container').classList.add('hidden');
        
        overlay.classList.remove('hidden');
        overlay.classList.add('flex');
        setTimeout(() => {
            overlay.classList.remove('opacity-0');
            card.classList.remove('scale-95');
        }, 10);
        
        const params = new URLSearchParams(hash.substring(1));
        const accessToken = params.get("access_token");

        window.history.replaceState(null, null, window.location.pathname);

        try {
          const res = await fetch("https://www.googleapis.com/oauth2/v3/userinfo", {
            headers: { Authorization: `Bearer ${accessToken}` }
          });
          const userInfo = await res.json();
          
          if (!userInfo.email) throw new Error("Could not retrieve email from Google.");

          // LAYER 1: STRICT DOMAIN FIREWALL
          const allowedDomain = "@4g-capital.com";
          if (!userInfo.email.toLowerCase().endsWith(allowedDomain)) {
              throw new Error(`Unauthorized network. Only corporate ${allowedDomain} accounts are permitted to access this system.`);
          }

          // LAYER 2: DATABASE VERIFICATION
          const backendRes = await fetch(`${LOGIN_API_BASE}/login`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: userInfo.email })
          });
          
            const responseText = await backendRes.text();
            let data;
            try {
              data = JSON.parse(responseText);
            } catch {
              throw new Error(`API returned HTTP ${backendRes.status} instead of JSON. ${responseText.slice(0, 160)}`);
            }

            if (!backendRes.ok) {
              throw new Error(data.detail || "ACCESS DENIED: Your email is not registered in the active users database. Contact your Ops Manager.");
            }

          localStorage.setItem('USER_EMAIL', data.email);
          localStorage.setItem('USER_ROLE', data.role);
          localStorage.setItem('LOGGED_IN_AGENT', data.name);
          
          if(data.role === "Control Agent") {
            window.location.replace('/workspace.html');
          } else {
            window.location.replace('/overview.html');
          }

        } catch (err) {
          overlay.classList.add('opacity-0');
          setTimeout(() => overlay.classList.add('hidden'), 300);
          
          document.querySelector('#login-error h3').innerText = 'Sign-in unavailable';
          document.getElementById('login-error-text').innerText = err.message;
          document.getElementById('login-error').classList.remove('hidden');
          document.getElementById('login-error').classList.add('flex');
          document.getElementById('google-btn-container').classList.remove('hidden');
        }
      } else {
        if (typeof enforceSecurity === 'function') enforceSecurity();
      }
    };
  </script>
</body>
</html>
