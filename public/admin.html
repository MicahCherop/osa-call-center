<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin - User Management</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- 1. Fetch the absolute thinnest font weights from Google -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300&display=swap" rel="stylesheet">
  
  <!-- 2. Force Tailwind to render ALL text as thin -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'] },
          // This mapping forces every element to be thin, ignoring "font-bold" classes
          fontWeight: {
            black: '200', 
            extrabold: '200', 
            bold: '200', 
            semibold: '200',
            medium: '200', 
            normal: '200', 
            light: '200',
            extralight: '100',
            thin: '100'
          },
          colors: {
            brandDark: '#0f172a',
            brandAmber: '#f59e0b',
            glass: 'rgba(255, 255, 255, 0.65)',
            glassDarker: 'rgba(255, 255, 255, 0.8)',
          },
          animation: {
            blob: "blob 10s infinite",
            pulseSlow: "pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite",
          },
          keyframes: {
            blob: {
              "0%": { transform: "translate(0px, 0px) scale(1)" },
              "33%": { transform: "translate(30px, -50px) scale(1.1)" },
              "66%": { transform: "translate(-20px, 20px) scale(0.9)" },
              "100%": { transform: "translate(0px, 0px) scale(1)" }
            }
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/callcenter.css">
</head>
<body data-page="admin" class="flex h-screen bg-slate-50 text-brandDark">
  
  <main class="flex-1 p-6 overflow-y-auto">
    <header class="glass-panel rounded-2xl px-6 py-4 mb-6 flex justify-between items-center shadow-sm bg-white/80">
      <h1 class="text-2xl font-bold tracking-tight"><i class="fa-solid fa-shield-halved mr-2 text-brandAmber"></i> Ops Manager Admin</h1>
      <button onclick="promptLogout()" class="text-sm font-bold bg-brandAmber hover:bg-amber-600 text-white px-4 py-2 rounded-lg transition shadow-sm"><i class="fa-solid fa-right-from-bracket mr-1"></i> Logout</button>
    </header>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      <!-- Create Managers Form -->
      <div class="glass-panel p-6 rounded-2xl bg-white/80 shadow-md border border-brandDark/10 h-fit">
        <h2 class="text-lg font-bold mb-4 border-b border-brandDark/10 pb-2">Add Leadership Role</h2>
        <form onsubmit="createUser(event, 'admin')" class="space-y-4">
          <div>
            <label class="block text-xs font-bold mb-1 uppercase text-brandDark/70">Full Name</label>
            <input type="text" id="admin-new-name" required class="glass-input rounded-lg w-full px-3 py-2 border border-brandDark/20">
          </div>
          <div>
            <label class="block text-xs font-bold mb-1 uppercase text-brandDark/70">Email Address</label>
            <input type="email" id="admin-new-email" required class="glass-input rounded-lg w-full px-3 py-2 border border-brandDark/20">
          </div>
        <div>
            <label class="block text-xs font-bold mb-1 uppercase text-brandDark/70">Role</label>
            <select id="admin-new-role" required class="glass-input rounded-lg w-full px-3 py-2 border border-brandDark/20">
              <option value="Team Leader">Team Leader</option>
              <option value="Ops Manager">Ops Manager</option>
              <option value="Admin">Admin</option>
            </select>
        </div>
          <div>
            <label class="block text-xs font-bold mb-1 uppercase text-brandDark/70">Temporary Password</label>
            <input type="text" id="admin-new-password" required class="glass-input rounded-lg w-full px-3 py-2 border border-brandDark/20">
          </div>
          <div class="flex justify-end mt-4">
            <button type="submit" class="w-full bg-brandAmber text-white px-6 py-2 rounded-lg font-bold hover:bg-amber-600 transition shadow-md">Create User</button>
          </div>
        </form>
      </div>

      <!-- System Users List -->
      <div class="glass-panel p-6 rounded-2xl bg-white/80 shadow-md border border-brandDark/10 lg:col-span-2">
        <h2 class="text-lg font-bold mb-4 border-b border-brandDark/10 pb-2">All System Users</h2>
        <div class="overflow-x-auto rounded-xl border border-brandDark/10">
          <table class="w-full text-left border-collapse whitespace-nowrap">
            <thead class="bg-brandDark text-white">
              <tr class="text-[11px] font-bold uppercase tracking-wider">
                <th class="px-4 py-3">Name</th>
                <th class="px-4 py-3">Email</th>
                <th class="px-4 py-3">Role</th>
                <th class="px-4 py-3">Status</th>
              </tr>
            </thead>
            <tbody id="admin-users-tbody" class="text-[13px] font-medium bg-white">
              <!-- Dynamically Populated -->
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </main>
  
  <script src="/callcenter.js"></script>
</body>
</html>
