<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#f59e0b">
  <script>if (localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('dark');</script>
  <title>Call Center Campaigns</title>
  <link rel="stylesheet" href="/callcenter-tailwind.css">
  <link rel="stylesheet" href="/callcenter.css">
  <link rel="icon" type="image/png" href="/static/icon.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- 1. ADD THE GOOGLE IDENTITY SERVICES SDK -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>

<body data-page="login" class="text-brandDark font-sans font-normal text-sm h-screen overflow-hidden flex items-center justify-center relative bg-white">
  
  <!-- BACKGROUND BLOBS -->
  <div class="absolute inset-0 z-0 overflow-hidden pointer-events-none opacity-40">
    <div class="absolute top-[-10%] left-[-10%] w-[40rem] h-[40rem] bg-amber-100 rounded-full mix-blend-multiply filter blur-3xl animate-blob"></div>
    <div class="absolute bottom-[-20%] right-[-10%] w-[45rem] h-[45rem] bg-slate-100 rounded-full mix-blend-multiply filter blur-3xl animate-blob"></div>
  </div>
  
  <!-- LOGIN CARD -->
  <div class="glass-panel p-10 rounded-2xl w-full max-w-md relative z-10 shadow-2xl text-center page-enter border border-brandDark/5">
    
    <img src="https://images.squarespace-cdn.com/content/v1/55ed8436e4b038f693789ca0/1599234024445-FSJEOUYNYWV4X6HDN50R/4G+CAPITAL+LOGO+FA-01.png?format=750w" 
         alt="4G Capital Logo" 
         class="h-20 mx-auto mb-8 object-contain">
    
    <h1 class="text-3xl font-medium text-brandDark mb-2">Call Center Campaigns</h1>
    <p class="text-brandDark/60 text-sm font-normal mb-8">Welcome to Call Center Campaigns<br>Sign in securely to access your workspace</p>
    
    <!-- 2. EMPTY CONTAINER FOR GOOGLE TO RENDER ITS SECURE BUTTON -->
    <div id="google-btn-container" class="flex justify-center mb-2 min-h-[40px]"></div>
    
    <!-- ERROR NOTIFICATION -->
    <div id="login-error" class="bg-red-50 border-2 border-red-500 text-red-700 p-5 rounded-xl mt-5 hidden flex-col items-center gap-2 shadow-sm">
      <i class="fa-solid fa-shield-virus text-4xl mb-1 text-red-600"></i>
      <h3 class="font-bold text-lg uppercase tracking-wider text-red-800">Restricted Access</h3>
      <span id="login-error-text" class="font-medium text-sm text-center"></span>
    </div>
  </div>

  <!-- REDIRECTING / LOADING MODAL -->
  <div id="loading-overlay" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 hidden opacity-0 transition-opacity duration-300 items-center justify-center">
    <div class="bg-white p-8 rounded-2xl shadow-2xl flex flex-col items-center max-w-sm w-full mx-4 transform scale-95 transition-transform duration-300" id="loading-modal-card">
      <div class="w-12 h-12 border-4 border-brandAmber border-t-transparent rounded-full animate-spin mb-4"></div>
      <h3 class="text-lg font-medium text-brandDark" id="loading-title">Verifying Identity...</h3>
      <p class="text-sm text-brandDark/50 mt-1 text-center" id="loading-text">Checking authorization protocols.</p>
    </div>
  </div>
  
  <script src="/callcenter.js"></script>
  
  <script>
    const CLIENT_ID = "106325673835-4moq7op50u80oet78ln84t241a88a200.apps.googleusercontent.com";
    const LOGIN_API_BASE = `${window.location.origin}/api`;
    
    // 3. INITIALIZE GIS ON WINDOW LOAD
    window.onload = function () {
      google.accounts.id.initialize({
        client_id: CLIENT_ID,
        callback: handleCredentialResponse,
        // Optional: Auto-selects the user if they only have one Google account logged in
        auto_select: false 
      });

      // Render the official Google button
      google.accounts.id.renderButton(
        document.getElementById("google-btn-container"),
        { theme: "outline", size: "large", width: "260", shape: "rectangular" }
      );
    };

    // Helper to decode the JWT payload purely for frontend UI checks
    function parseJwt(token) {
      try {
        const base64Url = token.split('.')[1];
        const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
        const jsonPayload = decodeURIComponent(atob(base64).split('').map(function(c) {
            return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
        }).join(''));
        return JSON.parse(jsonPayload);
      } catch (e) {
        return null;
      }
    }

    // 4. HANDLE THE SECURE CALLBACK
    async function handleCredentialResponse(response) {
      const overlay = document.getElementById('loading-overlay');
      const card = document.getElementById('loading-modal-card');
      
      // Hide errors & show loading
      document.getElementById('login-error').classList.add('hidden');
      document.getElementById('login-error').classList.remove('flex');
      
      overlay.classList.remove('hidden');
      overlay.classList.add('flex');
      setTimeout(() => {
          overlay.classList.remove('opacity-0');
          card.classList.remove('scale-95');
      }, 10);

      try {
        // response.credential contains the secure JWT ID Token from Google
        const idToken = response.credential;
        const payload = parseJwt(idToken);

        if (!payload || !payload.email) {
            throw new Error("Could not parse secure identity token.");
        }

        // LAYER 1: STRICT DOMAIN FIREWALL (Frontend check for UX)
        const allowedDomain = "@4g-capital.com";
        if (!payload.email.toLowerCase().endsWith(allowedDomain)) {
            throw new Error(`Unauthorized network. Only corporate ${allowedDomain} accounts are permitted.`);
        }

        // LAYER 2: DATABASE VERIFICATION
        const backendRes = await fetch(`${LOGIN_API_BASE}/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          // SEND THE JWT TOKEN, NOT THE EMAIL
          body: JSON.stringify({ token: idToken }) 
        });
        
        const responseText = await backendRes.text();
        let data;
        try {
          data = JSON.parse(responseText);
        } catch {
          throw new Error(`API returned HTTP ${backendRes.status} instead of JSON.`);
        }

        if (!backendRes.ok) {
          throw new Error(data.detail || "ACCESS DENIED: Your account is not registered. Contact your Ops Manager.");
        }

        // Setup session
        localStorage.setItem('AUTH_TOKEN', idToken);
        localStorage.setItem('USER_EMAIL', data.email);
        localStorage.setItem('USER_ROLE', data.role);
        localStorage.setItem('LOGGED_IN_AGENT', data.name);
        
        // Route based on role
        if(data.role === "Control Agent") {
          window.location.replace('/workspace');
        } else {
          window.location.replace('/overview');
        }

      } catch (err) {
        // Hide loading modal
        overlay.classList.add('opacity-0');
        setTimeout(() => overlay.classList.add('hidden'), 300);
        
        // Show error
        document.querySelector('#login-error h3').innerText = 'Sign-in unavailable';
        document.getElementById('login-error-text').innerText = err.message;
        document.getElementById('login-error').classList.remove('hidden');
        document.getElementById('login-error').classList.add('flex');
      }
    }
  </script>
</body>
</html>
